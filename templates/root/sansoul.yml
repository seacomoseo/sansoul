# Generated by `sh do root-docs` from core/templates/root/sansoul.yml. Do not edit:
# the CI logic lives in core/ci/run and follows the pinned SanSoul version.
name: SanSoul
on:
  push:
    branches: [main]
  workflow_dispatch:
  # «Publicar cambios» in Sveltia: CMS saves carry [skip ci].
  repository_dispatch:
    types: [sveltia-cms-publish]
{{NETLIFY_SCHEDULE}}
concurrency:
  group: sansoul
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  site:
    name: Backup, build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: sh core/ci/run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          GL_PAT: ${{ secrets.GL_PAT }}
          GITHUB_TOKEN: ${{ github.token }}
