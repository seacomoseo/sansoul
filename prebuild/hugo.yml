disableKinds:
- sitemap
- taxonomy
- term

outputs:
  home:
  - html

caches:
  getresource:
    maxAge: 24h

theme: []

params:
  # These become the complete project mount table in the generated main config.
  # Content indexes and global values are appended as per-file mounts during
  # prebuild so ordinary content files have only one Hugo watch target.
  mainModuleMounts:
  - source: static
    target: static
  - source: uploads
    target: static/u
    files:
    - '! fonts/**'
  - source: assets
    target: assets
  - source: uploads
    target: assets/u
  - source: node_modules/material-symbols
    target: assets/fonts
  - source: ../_tools/node_modules/material-symbols
    target: assets/fonts
  - source: themes/sansoul/assets/u/icons/brands
    target: assets/u/icons/brands
  - source: node_modules/@fortawesome/fontawesome-free/svgs/brands
    target: assets/u/icons/brands
  - source: ../_tools/node_modules/@fortawesome/fontawesome-free/svgs/brands
    target: assets/u/icons/brands
  - source: node_modules/simple-icons/icons
    target: assets/u/icons/brands
  - source: ../_tools/node_modules/simple-icons/icons
    target: assets/u/icons/brands
  - source: content/single/_home.es.md
    target: content/_index.es.md
    sites:
      matrix:
        languages: [es]
  - source: content/single/_home.en.md
    target: content/_index.en.md
    sites:
      matrix:
        languages: [en]
  - source: content/single/_home.fr.md
    target: content/_index.fr.md
    sites:
      matrix:
        languages: [fr]
  - source: content/single/_home.de.md
    target: content/_index.de.md
    sites:
      matrix:
        languages: [de]
  - source: content/single/_home.pt.md
    target: content/_index.pt.md
    sites:
      matrix:
        languages: [pt]
  - source: content/single/_home.it.md
    target: content/_index.it.md
    sites:
      matrix:
        languages: [it]
  - source: content
    target: content
    files:
    - '! global.*.yml'
    - '! single/_home.*.md'
    - '! */_index.*.md'
  - source: themes/sansoul/content
    target: content
  - source: data
    target: data
    files:
    - '! **/example/*'
  - source: i18n
    target: data/i18n
  - source: themes/sansoul/i18n
    target: data/i18n

module:
  mounts:
  - source: ../../../
    target: assets
    files:
    - content/**/_index.*.md
    - content/global.*.yml

  - source: ../../../data
    target: data
  - source: ../data
    target: data
  - source: ../i18n
    target: data/i18n

  - source: ../layouts/partials/func
    target: layouts/partials/func
  - source: layouts
    target: layouts
