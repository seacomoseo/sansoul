pagination:
  disableAliases: false
  pagerSize: 24
  path: page
buildFuture: true
timeZone: Europe/Madrid
params:
  currency: EUR
  phone_code: 34
  _merge: deep
cascade:
- params:
    emoji: 📑
    type: single
    base: page
  target:
    path: /
  _merge: deep
_merge: deep

defaultContentLanguage: es

languages:
  es:
    # baseURL: https://sansoul.netlify.com
    disabled: true
    weight: 1
    label: Español
    pagination:
      path: pagina
  en:
    # baseURL: https://es.sansoul.netlify.com
    disabled: true
    weight: 2
    label: English
    pagination:
      path: page
  fr:
    # baseURL: https://fr.sansoul.netlify.com
    disabled: true
    weight: 3
    label: Français
    pagination:
      path: page
  de:
    # baseURL: https://de.sansoul.netlify.com
    disabled: true
    weight: 4
    label: Deutsch
    pagination:
      path: seite
  pt:
    # baseURL: https://pt.sansoul.netlify.com
    disabled: true
    weight: 5
    label: Português
    pagination:
      path: pagina
  it:
    # baseURL: https://it.sansoul.netlify.com
    disabled: true
    weight: 6
    label: Italiano
    pagination:
      path: pagina

module:
  hugoVersion:
    min: 0.164.0
  mounts:

  # static
  - source: static
    target: static
  - source: node_modules/material-symbols
    target: static/fonts
  # assets
  - source: assets
    target: assets
  - source: node_modules/material-symbols
    target: assets/fonts
  - source: ../_tools/node_modules/material-symbols
    target: assets/fonts
  - source: themes/sansoul/assets/u/icons/brands
    target: assets/u/icons/brands
  - source: node_modules/@fortawesome/fontawesome-free/svgs/brands
    target: assets/u/icons/brands
  - source: ../_tools/node_modules/@fortawesome/fontawesome-free/svgs/brands
    target: assets/u/icons/brands
  - source: node_modules/simple-icons/icons
    target: assets/u/icons/brands
  - source: ../_tools/node_modules/simple-icons/icons
    target: assets/u/icons/brands
  ## content home by langs
  - source: content/single/_home.es.md
    target: content/_index.es.md
    sites:
      matrix:
        languages: [es]
  - source: content/single/_home.en.md
    target: content/_index.en.md
    sites:
      matrix:
        languages: [en]
  - source: content/single/_home.fr.md
    target: content/_index.fr.md
    sites:
      matrix:
        languages: [fr]
  - source: content/single/_home.de.md
    target: content/_index.de.md
    sites:
      matrix:
        languages: [de]
  - source: content/single/_home.pt.md
    target: content/_index.pt.md
    sites:
      matrix:
        languages: [pt]
  - source: content/single/_home.it.md
    target: content/_index.it.md
    sites:
      matrix:
        languages: [it]
  ## content
  - source: content
    target: content
    files:
    - '! values.*.yml'
    - '! single/_home.*.md'
  ## content prebuild
  - source: themes/sansoul/prebuild/public/content
    target: content
  ## content theme
  - source: themes/sansoul/content
    target: content
  # data
  - source: data
    target: data
    files:
    - '! **/example/*'
  - source: i18n
    target: data/i18n
  - source: themes/sansoul/i18n
    target: data/i18n


# default without option in cms

summaryLength: 15
enableRobotsTXT: true
removePathAccents: true

taxonomies: {}

disableKinds:
- taxonomy
- term

related:
  includeNewer: true
  threshold: 80
  toLower: true
  indices:
  - name: date
    weight: 10
  - name: category
    weight: 80
  - name: author
    weight: 80

outputs:
  home: [HTML, RSS, JSON]
  page: [HTML]
  section: [HTML]
  taxonomy: [HTML]
  term: [HTML]

mediaTypes:
  application/rss+xml:
    suffixes: [xml]
  font/woff2:
    suffixes: [woff2]

outputFormats:
  RSS:
    mediaType: application/rss+xml
    baseName: feed
    permalinkable: true

markup:
  tableOfContents:
    ordered: true
    endLevel: 6
  defaultMarkdownHandler: goldmark
  goldmark:
    renderer:
      unsafe: true
    parser:
      autoHeadingIDType: github-ascii
      wrapStandAloneImageWithinParagraph: false
      attribute:
        block: true
    extensions:
      strikethrough: false
      extras:
        delete:
          enable: true
        insert:
          enable: true
        mark:
          enable: true
        subscript:
          enable: true
        superscript:
          enable: true
      passthrough:
        delimiters:
          block:
          - - \[
            - \]
          - - $$
            - $$
          inline:
          - - \(
            - \)
        enable: true

frontmatter:
  date:
  - date
  lastmod:
  - last
  - mod
  - lastmod
  - :git
  - date
  - publishDate

security:
  exec:
    allow:
    - ^dart-sass-embedded$
    - ^go$
    - ^npx$
    - ^postcss$
    - ^sass$
  funcs:
    getenv:
    - ^HUGO_
    - ^CI$
    - ^NETLIFY$

caches:
  getresource:
    maxAge: 0

timeout: 240s
