    quote: null # string
fonts:
  base:
    family: Montserrat # string
    weight: 400 # [ 0, 100, 200, 300, 400, 500, 600, 700, 800, 900 ]
    bold: 0 # [ 0, 100, 200, 300, 400, 500, 600, 700, 800, 900 ]
    italic: n # boolean
    line_height: 1.25 # [ 0.00 - 3.00 ]
  cursive:
    family: Dancing Script # string
    weight: 400 # [ 0, 100, 200, 300, 400, 500, 600, 700, 800, 900 ]
    bold: 0 # [ 0, 100, 200, 300, 400, 500, 600, 700, 800, 900 ]
    italic: n # boolean
    line_height: 1.25 # [ 0.00 - 3.00 ]
    size: 1 # [ 0.00 - 3.00 ]
  title:
    family: Montserrat # string
    weight: 800 # [ 0, 100, 200, 300, 400, 500, 600, 700, 800, 900 ]
    bold: 0 # [ 0, 100, 200, 300, 400, 500, 600, 700, 800, 900 ]
    italic: n # boolean
    line_height: 1.25 # [ 0.00 - 3.00 ]
    size: 1 # [ 0.00 - 3.00 ]
  blockquote_cursive: y # boolean
colors:
  main:
    color: '#bdd5ea' # string hex color 
    light: '#ffffff' # string hex color
    dark: '#ffffff' # string hex color
    turn:
      fill: n # boolean
      in: y # boolean
      text: y # boolean
  alt:
    color: '#ffffff' # string hex color 
    light: '#ffffff' # string hex color
    dark: '#ffffff' # string hex color
    turn:
      fill: y # boolean
      in: y # boolean
      text: y # boolean
  cta:
    color: '#fe5f55' # string hex color 
    light: '#ffffff' # string hex color
    dark: '#ffffff' # string hex color
    turn:
      fill: n # boolean
      in: y # boolean
      text: y # boolean
  base:
    white: '#ffffff' # string hex color
    light: '#eeeeee' # string hex color
    gray: '#767676' # string hex color
    dark: '#282525' # string hex color
    black: '#000000' # string hex color
rounded:
  radius: 0.33 # [ 0.00 - 1.25 ]
  chamfer: y # boolean
btns:
  pill: n # boolean
  disc: n # boolean
  deep: y # boolean
  outline: n # boolean
  font:
    type: title # [ base, title, cursive ]
    bold: n # boolean
    caps: y # boolean
  swap:
    type: base # [ base, title, cursive ]
    bold: n # boolean
    caps: n # boolean
inputs:
  fill: n # boolean
  labels: in # [ in, out ]
shadow:
  left: 0.15 # [ 0.00 - 99.00 ]
  top: 0.15 # [ 0.00 - 99.00 ]
  blur: 0 # [ 0.00 - 99.00 ]
  color: black # [ main, main-light, main-dark, alt, alt-light, alt-dark, cta, cta-light, cta-dark, white, light, gray, dark, black, turn, such ]
  alpha: 0.85 # [ 0.00 - 1.00 ]
