{{- /* Rendered right after the charset: strips checkout return parameters before analytics loads. */ -}}
    {{- with hugo.Data.commerce -}}
      {{- if eq .enabled true }}
        <meta name="referrer" content="no-referrer">
        <script>
          (() => {
            const url = new URL(window.location.href)
            const mode = url.searchParams.get('commerce')
            if (['success', 'cancel'].includes(mode)) {
              window.__sansoulCommerceReturn = { mode, orderId: url.searchParams.get('order_id') }
            }
            if (!url.searchParams.has('commerce') && !url.searchParams.has('order_id')) return
            url.searchParams.delete('commerce')
            url.searchParams.delete('order_id')
            window.history.replaceState(window.history.state, '', url.pathname + url.search + url.hash)
          })()
        </script>
      {{- end }}
    {{- end -}}
