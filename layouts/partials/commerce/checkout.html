<div class="commerce__total-row">
  <span>{{ i18n "commerce_total" }}</span>
  <strong data-commerce-total>—</strong>
</div>
{{ partial "commerce/note" (dict "key" "cart") }}
<p class="commerce__hint" data-commerce-quote-hint>{{ i18n "commerce_provisional_note" }}</p>
<p class="commerce__quote" data-commerce-quote-request hidden><a class="btn" href="{{ site.Home.RelPermalink }}#contacto">{{ i18n "commerce_request_quote" }}</a></p>
<button class="btn commerce__checkout" type="button" data-commerce-checkout disabled>{{ partial "icon" (dict "icon" "lock") }}<span>{{ i18n "commerce_checkout" }}</span></button>
<p class="commerce__checkout-note" data-commerce-checkout-note>{{ i18n "commerce_checkout_disabled" }}</p>
