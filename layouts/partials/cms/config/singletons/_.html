{{ $i  := hugo.Data.utilities.collections.icons }}
{{ $vf := "content/global.{{locale}}.yml" }}

{{ return slice
  (dict
    "file"      $vf
    "extension" `yml`
    "name"      `global`
    "label"     .global
    "icon"      $i.global
    "editor"    (dict "preview" false)
    "fields"    `~global`
    "i18n"      true
  )
}}
