build:
  cachebusters:
    - source: '^layouts/_default/baseof\.html'
      target: '(^|/)(admin/(index\.html|config\.yml)|css/cms(\.scss|\.css)|js/cms(/_index\.js|\.js))'
    - source: '^layouts/partials/files/statics\.html'
      target: '(^|/)(admin/(index\.html|config\.yml)|css/cms(\.scss|\.css)|js/cms(/_index\.js|\.js))'
    - source: '^layouts/partials/cms/.*'
      target: '(^|/)(admin/(index\.html|config\.yml)|css/cms(\.scss|\.css)|js/cms(/_index\.js|\.js))'
    - source: '^data/cms/.*'
      target: '(^|/)(admin/(index\.html|config\.yml)|css/cms(\.scss|\.css)|js/cms(/_index\.js|\.js))'
    - source: '^data/types/.*'
      target: '(^|/)(admin/(index\.html|config\.yml)|css/cms(\.scss|\.css)|js/cms(/_index\.js|\.js))'
    - source: '^data/[^/]+$'
      target: '(^|/)(admin/(index\.html|config\.yml)|css/cms(\.scss|\.css)|js/cms(/_index\.js|\.js))'
    - source: '^assets/(css/cms(\.scss|/.*)|js/cms(/.*|\.js))$'
      target: '(^|/)(admin/(index\.html|config\.yml)|css/cms(\.scss|\.css)|js/cms(/_index\.js|\.js))'
